<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <style>
    .layer { fill:#efefef; stroke:#6b6b6b; stroke-width:2; rx:18; }
    .item  { fill:#ffffff; stroke:#9a9a9a; stroke-width:1.2; rx:8; }
    .title { font-family: Arial, Helvetica, sans-serif; font-size:20px; fill:#111; font-weight:700; }
    .label { font-family: Arial, Helvetica, sans-serif; font-size:16px; fill:#111; }
    .muted { fill:#444; font-size:14px; }
    .arrow { stroke:#777; stroke-width:2; fill:none; }
    .shadow { filter:url(#f1); }
  </style>

  <defs>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 5 L 10 0 L 10 10 z" fill="#777" />
    </marker>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777" />
    </marker>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#cfcfcf" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Layer 1 -->
  <g transform="translate(60,80)">
    <rect class="layer shadow" x="0" y="0" width="1080" height="220" rx="18"/>
    <text x="30" y="42" class="title">KATMAN 1 — GİRDİ VE OKUMA KATMANI</text>
    <g transform="translate(40,80)">
      <rect class="item" x="0" y="0" width="420" height="80"/>
      <text x="210" y="48" text-anchor="middle" class="label">PyMuPDF (fitz)</text>
      <rect class="item" x="480" y="0" width="420" height="80"/>
      <text x="690" y="48" text-anchor="middle" class="label">CLI Orkestrasyonu (isle.py)</text>
    </g>
  </g>

  <!-- Layer 2 -->
  <g transform="translate(60,340)">
    <rect class="layer shadow" x="0" y="0" width="1080" height="220" rx="18"/>
    <text x="30" y="42" class="title">KATMAN 2 — ANALİZ VE DOĞRULAMA</text>
    <g transform="translate(40,80)">
      <rect class="item" x="0" y="0" width="420" height="80"/>
      <text x="210" y="48" text-anchor="middle" class="label">alan_cikarici.py (Regex)</text>
      <rect class="item" x="480" y="0" width="420" height="80"/>
      <text x="690" y="48" text-anchor="middle" class="label">Checksum Doğrulama</text>
    </g>
  </g>

  <!-- Layer 3 -->
  <g transform="translate(60,600)">
    <rect class="layer shadow" x="0" y="0" width="1080" height="220" rx="18"/>
    <text x="30" y="42" class="title">KATMAN 3 — YEREL YAPAY ZEKA & FALLBACK</text>
    <g transform="translate(40,80)">
      <rect class="item" x="0" y="0" width="420" height="80"/>
      <text x="210" y="48" text-anchor="middle" class="label">MLX-VLM (On-Premise Model)</text>
      <rect class="item" x="480" y="0" width="420" height="80"/>
      <text x="690" y="48" text-anchor="middle" class="label">bolucu.py (Sayfa Ayrıştırma)</text>
    </g>
  </g>

  <!-- Layer 4 -->
  <g transform="translate(60,860)">
    <rect class="layer shadow" x="0" y="0" width="1080" height="220" rx="18"/>
    <text x="30" y="42" class="title">KATMAN 4 — ÇIKTI, VERİ & KONTROL</text>
    <g transform="translate(40,80)">
      <rect class="item" x="0" y="0" width="420" height="80"/>
      <text x="210" y="48" text-anchor="middle" class="label">Yapılandırılmış Veri (JSON)</text>
      <rect class="item" x="480" y="0" width="420" height="80"/>
      <text x="690" y="48" text-anchor="middle" class="label">Operasyonel Dizinler (arsiv/, dogrulanmali/, okunamadi/)</text>
    </g>
  </g>

  <!-- Bidirectional arrows between layer centers -->
  <g transform="translate(600,300)">
    <line class="arrow" x1="0" y1="-20" x2="0" y2="60" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
  </g>
  <g transform="translate(600,560)">
    <line class="arrow" x1="0" y1="-20" x2="0" y2="60" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
  </g>
  <g transform="translate(600,820)">
    <line class="arrow" x1="0" y1="-20" x2="0" y2="60" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
  </g>

  <!-- Footer note -->
  <text x="600" y="1160" text-anchor="middle" class="muted">Monochrome layered architecture — project-specific schematic</text>

</svg>
